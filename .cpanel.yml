---
deployment:
  tasks:
    # Pull the latest code
    - export DEPLOYPATH=/home/username/public_html/
    - /bin/cp -R * $DEPLOYPATH

    # Install/Update Composer dependencies
    - cd $DEPLOYPATH && /usr/local/bin/composer install --no-dev --optimize-autoloader

    # Clear Laravel caches
    - cd $DEPLOYPATH && /usr/local/bin/php artisan config:cache
    - cd $DEPLOYPATH && /usr/local/bin/php artisan route:cache
    - cd $DEPLOYPATH && /usr/local/bin/php artisan view:cache

    # Run database migrations
    - cd $DEPLOYPATH && /usr/local/bin/php artisan migrate --force

    # Seed Notes module permissions if needed
    - cd $DEPLOYPATH && /usr/local/bin/php artisan db:seed --class=Modules\\Notes\\Database\\Seeders\\NotesDatabaseSeeder --force

    # Set proper permissions
    - cd $DEPLOYPATH && chmod -R 775 storage bootstrap/cache
    - cd $DEPLOYPATH && find storage -type f -exec chmod 664 {} \;
    - cd $DEPLOYPATH && find bootstrap/cache -type f -exec chmod 664 {} \;
