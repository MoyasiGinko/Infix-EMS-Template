name: Deploy to InfinityFree

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Composer autoloader
        run: |
          echo "=========================================="
          echo "COMPOSER AUTOLOADER CHECK"
          echo "=========================================="

          echo ""
          echo "Checking file:"
          test -f vendor/composer/autoload_static.php

          echo ""
          echo "File information:"
          ls -lah vendor/composer/autoload_static.php

          echo ""
          echo "SHA256:"
          sha256sum vendor/composer/autoload_static.php

          echo ""
          echo "Git tracking status:"
          git ls-files --error-unmatch vendor/composer/autoload_static.php

          echo ""
          echo "Composer directory:"
          ls -lah vendor/composer/

          echo ""
          echo "=========================================="
          echo "Composer autoloader exists and is tracked."
          echo "=========================================="

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.FTP_PORT }}
          server-dir: /htdocs/
          log-level: verbose
          dangerous-clean-slate: false
